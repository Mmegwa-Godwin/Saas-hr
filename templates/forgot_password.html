<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password | SaaS-HR</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/forgot-password.css') }}">
</head>
<body>
<div class="card">
<h2>SaaS-HR</h2>
<h3>Forgot your password?</h3>
<p>Enter your account email. If an account matches, reset instructions will be sent.</p>
<form id="forgotForm">
<input id="email" type="email" autocomplete="email" placeholder="Account email" required>
<button type="submit">Send Reset Link</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<p><a href="/">Back to login</a></p>
</div>

<script src="{{ url_for('static', filename='js/forgot-password.js') }}" defer></script>
</body>
</html>
