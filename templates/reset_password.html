<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | SaaS-HR</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/reset-password.css') }}">
</head>
<body>
<div class="card">
<h2>SaaS-HR</h2>
<h3>Choose a new password</h3>
<p>Use at least 12 characters.</p>
<form id="resetForm">
<input id="password" type="password" autocomplete="new-password" minlength="12" placeholder="New strong password (12+ characters)" required>
<input id="confirm" type="password" autocomplete="new-password" minlength="12" placeholder="Confirm new password" required>
<button type="submit">Reset Password</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<p><a href="/">Back to login</a></p>
</div>
<script id="reset-page-config" type="application/json">{{ {"token": token}|tojson }}</script>
<script src="{{ url_for('static', filename='js/reset-password.js') }}" defer></script>
</body>
</html>
